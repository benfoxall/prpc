
syntax = 'proto3';

import "common.proto";

message FileEntry {
  string filename = 1;
  uint64 size = 2;
  uint64 modified = 3;
  string type = 4;
}

message FileRequest { 
  string filename = 1;

  // optional local transform to apply
  string transform = 2;
}

message FileTransfer {
  bytes content = 1;
}

service OpfsService {
  rpc List(Noop) returns (stream FileEntry);

  rpc Fetch(FileRequest) returns (stream FileTransfer);
}
